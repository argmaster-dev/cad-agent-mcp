name: release

# Pushing a tag like v0.1.0 builds the AutoCAD package, tests the installer on a
# clean Windows runner and publishes a GitHub Release with:
#   cad-agent-mcp-autocad.zip   plugin + single-file MCP server + skills
#   install.ps1                 one-command installer
# Pull requests and pushes to main run the same build and installer test.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Type-check MCP servers
        run: |
          for d in autocad nanocad; do
            (cd mcp-server/$d && npm ci --no-audit --no-fund && npx tsc --noEmit -p .)
          done
      - name: Package
        run: scripts/release/package.sh "${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist-release/cad-agent-mcp-autocad.zip
            dist-release/install.ps1

  test-install:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist-release
      - name: Installer test (Windows PowerShell 5.1)
        shell: powershell
        run: scripts\release\test-install.ps1 -Zip dist-release\cad-agent-mcp-autocad.zip -Installer dist-release\install.ps1

  release:
    if: github.ref_type == 'tag'
    needs: test-install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist-release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          ИИ-агент (Claude Code, Codex) в AutoCAD через MCP: агент видит открытый чертёж — снимок окна, слои, блоки, поиск объектов — и вносит правки командами САПР и LISP по схеме «план → подтверждение → резервная копия → выполнение».

          ## Совместимость

          - **AutoCAD 2020** — плагин собран и проверялся именно на этой версии.
          - **Другие версии AutoCAD не проверялись**, установщик их не поддерживает.
          - **nanoCAD 24.1** — в релиз пока не входит, сборка из исходников (см. README).
          - Windows 10/11.

          ## Что нужно заранее

          1. AutoCAD 2020, запущенный хотя бы один раз (чтобы появился профиль пользователя).
          2. [Node.js](https://nodejs.org) 18 или новее — на нём работает MCP-сервер. Быстро: `winget install OpenJS.NodeJS.LTS`.
          3. ИИ-агент: [Claude Code](https://claude.com/claude-code) и/или Codex.

          ## Установка одной командой

          Откройте PowerShell (права администратора не нужны) и выполните:

          ```powershell
          irm https://github.com/argmaster-dev/cad-agent-mcp/releases/latest/download/install.ps1 | iex
          ```

          Установщик:
          - скачает архив релиза в `%LOCALAPPDATA%\cad-agent-mcp`;
          - пропишет автозагрузку плагина в AutoCAD 2020 (язык AutoCAD определяется сам);
          - подключит MCP-сервер `autocad-bridge` к Claude Code и Codex, если они установлены;
          - скопирует навыки агента в `~\.claude\skills` и `~\.agents\skills`.

          ## После установки

          1. Перезапустите AutoCAD 2020 и откройте **сохранённый** чертёж (несохранённый агент править не будет — некуда сделать резервную копию).
          2. Проверьте плагин: команда `CLAUDE_HTTP_STATUS` в командной строке AutoCAD должна ответить `listener is RUNNING`.
          3. Перезапустите агента и попросите: «проверь связь с AutoCAD и сделай снимок чертежа».

          ## Установка вручную

          Скачайте `cad-agent-mcp-autocad.zip`, распакуйте, затем:
          - в AutoCAD: `NETLOAD` → `plugin\ClaudeBridge.AutoCad.dll` (или `tools\install-autoload.ps1 -DllPath <путь к DLL>` для автозагрузки);
          - в Claude Code: `claude mcp add -s user autocad-bridge -- node "<папка>\server\index.mjs"`.

          ## Удаление

          ```powershell
          & ([scriptblock]::Create((irm https://github.com/argmaster-dev/cad-agent-mcp/releases/latest/download/install.ps1))) -Uninstall
          ```

          ## Если что-то не так

          Пишите в [Issues](https://github.com/argmaster-dev/cad-agent-mcp/issues): версия AutoCAD, язык, вывод установщика.

          [sitimlab.ru](https://sitimlab.ru/?utm_source=github&utm_medium=release) · Telegram [@sitimlab](https://t.me/sitimlab)
          EOF
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "cad-agent-mcp $TAG (AutoCAD 2020)" \
            --notes-file notes.md \
            --latest \
            dist-release/cad-agent-mcp-autocad.zip \
            dist-release/install.ps1
